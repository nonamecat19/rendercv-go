design:
  theme: classic
  sections:
    show_time_spans_in:
      - experience
      - education
  templates:
    education_entry:
      # The stock template prints AREA; DEGREE_WITH_AREA is the placeholder that
      # reaches locale.phrases.degree_with_area, so it has to be asked for.
      main_column: '**INSTITUTION**, DEGREE_WITH_AREA\nSUMMARY\nHIGHLIGHTS'
    # Both month arrays print on every date, so one render exercises all 24
    # strings rather than the twelve the default template would reach.
    single_date: 'MONTH_NAME|MONTH_ABBREVIATION|MONTH|MONTH_IN_TWO_DIGITS|DAY|DAY_IN_TWO_DIGITS|YEAR|YEAR_IN_TWO_DIGITS'
    date_range: 'START_DATE ==> END_DATE'
    time_span: 'HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS'
