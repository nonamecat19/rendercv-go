# The document the locale differential renders, once per locale.
#
# It exists to make a locale catalog *reachable*: every one of the thirty-one
# strings a catalog carries — six phrases, twelve month names, twelve
# abbreviations and `degree_with_area` — lands in the rendered `.typ` from here,
# checked by TestEveryCatalogStringReachesTheDocument. A CV that never prints a
# month cannot fail a locale test, which is why the twelve experience entries
# below step through the months one at a time.
#
# `single_date` asks for MONTH_NAME and MONTH_ABBREVIATION together so one
# render exercises both arrays rather than the twelve the stock template reaches,
# and the education template asks for DEGREE_WITH_AREA, which the stock one does
# not use at all.
#
# The `locale:` block is prepended by the harness, not stored here.
cv:
  name: Jane Doe
  location: Somewhere
  email: jane.doe@example.com
  website: https://rendercv.com/
  social_networks:
    - network: LinkedIn
      username: rendercv
  sections:
