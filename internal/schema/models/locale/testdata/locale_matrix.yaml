      - institution: Both Fields University
        area: Computer Science
        degree: PhD
        date:
        start_date: 2014-09
        end_date: 2018-06
        location: Anywhere
        highlights:
          - One highlight.
      - institution: No Degree University
        area: Mathematics
        date:
        start_date: 2010-11
        end_date: 2014-07
        location: Anywhere
